<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="run.me.at at a glance: Every version, in order, Repeatable, not believed, Never merged, Spread on the surface">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">Every version,</tspan><tspan x="44" dy="22">in order</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Every TypeScript</tspan><tspan x="44" dy="21">minor from 5.0 to</tspan><tspan x="44" dy="21">7.0, Node 18 to 26</tspan><tspan x="44" dy="21">and Next.js 13.5 to</tspan><tspan x="44" dy="21">16.4, on one project.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="256" dy="0">Repeatable, not</tspan><tspan x="256" dy="22">believed</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Each number ships</tspan><tspan x="256" dy="21">with the machine, the</tspan><tspan x="256" dy="21">versions, the cache</tspan><tspan x="256" dy="21">state and the</tspan><tspan x="256" dy="21">command.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="468" dy="0">Never merged</tspan></text>
<text x="468" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">Results from</tspan><tspan x="468" dy="21">different hardware,</tspan><tspan x="468" dy="21">cache states or</tspan><tspan x="468" dy="21">toolchains never</tspan><tspan x="468" dy="21">share one ranking.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="680" dy="0">Spread on the</tspan><tspan x="680" dy="22">surface</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="680" dy="0">Iteration count and</tspan><tspan x="680" dy="21">spread sit next to</tspan><tspan x="680" dy="21">every value, and</tspan><tspan x="680" dy="21">single runs are</tspan><tspan x="680" dy="21">labelled.</tspan></text>
</svg>
